<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon-eren.png">
  <title>内容管理 — Haotlas</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f5f2;--fg:#17191a;--muted:#64696c;--line:#c8ccca}
    @media(prefers-color-scheme:dark){:root{--bg:#0b0c0d;--fg:#f2f1ed;--muted:#a4a6a6;--line:#343638}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{width:calc(100% - 40px);max-width:620px;margin:12vh auto;padding:32px 0}a{color:inherit;text-underline-offset:5px}a:focus-visible{outline:2px solid var(--fg);outline-offset:6px}.brand{font-size:24px;font-weight:650;text-decoration:none;letter-spacing:-1px}h1{font-size:36px;font-weight:500;letter-spacing:-1px;margin:48px 0 16px}p{margin:0 0 20px;color:var(--muted)}.actions{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:32px 0}.primary{display:inline-flex;min-height:48px;align-items:center;background:var(--fg);color:var(--bg);padding:8px 26px;border-radius:5px;text-decoration:none}.note{border-top:1px solid var(--line);padding-top:24px;font-size:14px}.credit{font-size:13px;margin-top:30px}@media(max-width:540px){main{margin:5vh auto}h1{font-size:31px;margin-top:36px}}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">Haotlas</a>
    <h1>写文稿，整理摄影。</h1>
    <p>可视化排版与 Markdown 源码随时切换，支持图片上传。保存后同步到 GitHub，网站随后自动更新。</p>
    <div class="actions"><a class="primary" href="https://app.pagescms.org/Li-yao114/haotlas.com/main">进入编辑器</a><a href="/">查看网站</a></div>
    <p class="note">首次使用请用 GitHub 登录，并安装 Pages CMS 的 GitHub App。选择仅授权 <strong>haotlas.com</strong> 仓库；连接后即可编辑“文稿”和“摄影手记”。</p>
    <p class="credit">编辑界面由 <a href="https://pagescms.org/">Pages CMS</a> 提供。</p>
  </main>
</body>
</html>
