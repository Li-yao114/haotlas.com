<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Haotlas 的个人站点：技术文稿、摄影和长期记录。" />
    <meta name="theme-color" content="#0b0c0d" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-eren.png" />
    <link rel="shortcut icon" href="/favicon.ico?v=eren-20261122" />
    <meta property="og:title" content="Haotlas" />
    <meta property="og:description" content="技术文稿、摄影和长期记录。" />
    <title>Haotlas</title>
    <script>
      (() => {
        let mode = 'dark';
        try { mode = localStorage.getItem('haotlas-theme') || mode; } catch {}
        if (!['light', 'dark', 'system'].includes(mode)) mode = 'dark';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <noscript>请启用 JavaScript 以浏览文稿与摄影作品。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
